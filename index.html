<head>

<style>
:root{--bg:#232323;--card:#000;--box:#101010;--mut:#9b9b9b;--blue:#0b86c9;--sel:#1e88e5;--gold:#f6b93b;--dk:#07121d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:'Noto Kufi Arabic',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{width:100%;max-width:420px;height:100dvh;min-height:100dvh;max-height:none;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
svg{width:24px;height:24px;fill:#fff;flex:none}
.bar{background:#000;height:72px;display:flex;align-items:center;justify-content:center;position:relative;font-size:18px;font-weight:500;flex:none}
.bar button{position:absolute;right:14px}
#scr{position:relative;z-index:30;flex:1;overflow-y:auto;padding:13px 13px 96px;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none}#scr::-webkit-scrollbar,#sh::-webkit-scrollbar,.player::-webkit-scrollbar{display:none;width:0;height:0}
.prayer-banner{margin:-13px -13px 6px;border-radius:0!important;width:calc(100% + 26px)}
.prayer-banner{margin-bottom:6px}
.grid.sm{gap:8px;margin-left:-13px;margin-right:-13px;width:calc(100% + 26px)}
.grid.sm .tile{border-radius:20px;border:0}
/* reference button language: rounded panels, outlined icons, and a soft wave layer */
.grid.sm .tile,.home-quick-grid button,.home-highlights button{position:relative;overflow:hidden;background:linear-gradient(180deg,#242424 0%,#090909 100%);border:1px solid rgba(255,255,255,.16);border-radius:20px;box-shadow:0 5px 14px rgba(0,0,0,.42);color:#fff}
.grid.sm .tile:before,.home-quick-grid button:before,.home-highlights button:before{content:"";position:absolute;left:-12%;right:-12%;bottom:-42%;height:78%;border-radius:50% 50% 0 0;background:rgba(72,72,72,.28);transform:rotate(-3deg);pointer-events:none}
.grid.sm .tile>* ,.home-quick-grid button>* ,.home-highlights button>*{position:relative;z-index:1}
.grid.sm .tile svg,.home-quick-grid button svg,.home-highlights button svg{fill:none;stroke:#fff;stroke-width:1.6}
.grid.sm .tile .q,.home-quick-grid button .q{font-weight:400;color:#fff}
#scr.in{animation:fi .28s cubic-bezier(.22,.61,.36,1);will-change:opacity,transform}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:#000;border-radius:23px;padding:14px;margin-bottom:6px}
.hd{background:linear-gradient(135deg,#000,#1a1a1a)}
.sec{text-align:center;font-size:16px;margin:14px 0}
.mut{color:var(--mut)}

/* nav */
#nav{position:absolute;bottom:0;left:0;right:0;height:66px;background:#000;display:flex;border-radius:0}
#nav .t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9px;font-size:12px;font-weight:500;gap:3px;position:relative;z-index:2}
#nav .t svg{width:22px;height:22px;transition:opacity .3s}
#nav .t.on svg{opacity:0}
#bump{position:absolute;top:-22px;width:68px;height:44px;background:#000;border-radius:50% 50% 0 0;transition:left .5s cubic-bezier(.34,1.56,.64,1);z-index:1}
#dot{position:absolute;top:-21px;width:43px;height:43px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px var(--bg);display:flex;align-items:center;justify-content:center;transition:left .5s cubic-bezier(.34,1.56,.64,1);z-index:3;pointer-events:none}
#dot svg{width:22px;height:22px}
#dot.pop svg{animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.2) rotate(-40deg)}to{transform:none}}
#dot.lift{animation:lift .6s cubic-bezier(.34,1.56,.64,1)}
#bump.lift{animation:liftb .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes lift{0%{transform:translateY(28px) scale(.75)}100%{transform:none}}
@keyframes liftb{0%{transform:translateY(22px)}100%{transform:none}}
.tile,.vi,.op,.pb,.pill,.btn,.cn{transition:transform .2s cubic-bezier(.22,.61,.36,1),box-shadow .2s}
.vi:active,.op:active,.pb:active,.pill:active,.btn:active,.cn:active{transform:translateY(2px) scale(.97)}
#gb{display:none}#scr{scrollbar-gutter:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;touch-action:pan-y}
/* videos */
.player{position:relative;padding:0;height:auto;overflow:hidden}
.thumb{background:linear-gradient(135deg,#0b3a5c,#0b86c9 60%,#f6b93b);border-radius:10px}
.pv{width:calc(100% - 28px);height:200px;margin:14px auto 12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pv svg{width:48px;height:48px}
.ctl{position:absolute;bottom:12px;left:14px;right:14px;display:flex;align-items:center;gap:8px;font-size:10px;direction:ltr}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;background:#444;border-radius:3px;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#e8def8}
.vi{background:#000;border-radius:18px;height:59px;margin-bottom:9px;display:flex;align-items:center;padding:0 10px;gap:10px;border:1.5px solid transparent;direction:ltr;cursor:pointer;width:100%;text-align:center}
.vi.sel{border-color:var(--sel)}
.vi .th{width:63px;height:35px;border-radius:6px}
.vi .tx{flex:1;direction:rtl;min-width:0}
.vi b{display:block;font-size:12px;font-weight:500}
.vi small{display:block;font-size:9px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;animation:pop .3s ease-out}
.ck svg{width:15px;height:15px;fill:#000}
.ph{width:22px}
/* quran */
.ttl{font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;direction:ltr}
.row small{font-size:9.5px;color:var(--mut)}
.pill{background:#262626;border-radius:99px;width:130px;height:28px;margin:10px auto 0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:10px}
.pill svg{width:18px;height:18px}
.vc{background:transparent!important;border:0;border-radius:0;padding:8px 0 10px;margin:0;transition:box-shadow .2s}.vc .bx{background:transparent;border-radius:0;padding:4px 0;margin-top:2px}.det-item{background:transparent!important;border-radius:0!important;padding:12px 0!important;margin:0!important;border-bottom:1px solid #1a1a1a}.adhkar-title{font-size:17px;text-align:center;margin:10px 0 4px}.adhkar-text{background:transparent;border:0;padding:9px 0;border-bottom:1px solid #1a1a1a}.adhkar-text .verse{margin:0;line-height:2.1}.adhkar-player{display:flex;gap:8px;align-items:center;margin-top:8px}.adhkar-player select{flex:1;background:#111;color:#fff;border:1px solid #333;border-radius:12px;height:36px;padding:0 8px;font:inherit;font-size:10px}.adhkar-player .pill{margin:0;width:auto;padding:0 14px;white-space:nowrap}
.vc.pl{box-shadow:inset 0 0 0 1.5px var(--blue)}
.vh{display:flex;align-items:center;justify-content:space-between}
.pb{width:31px;height:31px;border-radius:10px;background:var(--dk);display:flex;align-items:center;justify-content:center}
.pb svg{width:18px;height:18px}
.ar{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:var(--fs,17px);line-height:2.1;margin:10px 0;text-align:right}
.bx{background:var(--box);border-radius:15px;padding:10px 12px;margin-top:8px}
.bx .h{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--mut);cursor:pointer}
.bx .h svg{width:20px;height:20px}
.bx p{font-size:11px;line-height:1.7;margin-top:6px}
.en{direction:ltr;text-align:left;font-family:'Noto Sans',sans-serif}
.tf p{max-height:3.4em;overflow:hidden;transition:max-height .3s}
.tf.x p{max-height:30em}
.ib svg{width:20px;height:20px}
.gold svg{fill:var(--gold)}
/* sheet */
#ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10}
#ov.on{display:block}
#sh{position:absolute;left:0;right:0;bottom:0;background:#000;border-radius:20px 20px 0 0;padding:16px;max-height:75%;overflow-y:auto;transform:translateY(100%);transition:transform .38s ease-out;z-index:11}
#ov.on #sh{transform:none}
#sh h3{text-align:center;font-size:15px;font-weight:500;margin-bottom:12px}
.srch{height:43px;border-radius:99px;border:1px solid #333;background:#111;width:100%;color:#fff;padding:0 16px;font:inherit;font-size:12px;margin-bottom:10px}
.li{display:block;width:100%;text-align:center;font-size:11px;padding:12px 0;border-top:1px solid #444}
.tg{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid #444;font-size:12px}
.sw{width:42px;height:24px;border-radius:12px;background:#444;position:relative;transition:.2s}
.sw.on{background:#2ecc71}
.sw i{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{right:21px}
/* tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#000;border-radius:20px;height:146px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:13px;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile svg{width:37px;height:37px}
.tile .q{font-size:34px;font-weight:700;line-height:37px}
.cn{display:flex;align-items:center;justify-content:space-between;width:100%;background:#000;border-radius:18px;padding:14px 16px;margin-bottom:4px;font-size:12px;text-align:right;gap:10px}
.cn span{background:#141414;border-radius:12px;min-width:44px;padding:6px;text-align:center;font-size:15px;font-weight:700;color:#4fb3ec}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px;width:16px}
.eq i{flex:1;background:var(--gold);animation:eq .6s infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{from{height:20%}to{height:100%}}
/* quiz */
.chips{display:flex;gap:6px;justify-content:center;margin-top:10px;direction:rtl}
.chips span{background:#181818;border-radius:99px;height:23px;padding:0 8px;display:flex;align-items:center;gap:4px;font-size:9.5px}
.chips svg{width:12px;height:12px}
.qc{display:flex;gap:10px;align-items:flex-start;border-radius:18px;padding:14px}
.qn{width:45px;height:45px;border-radius:15px;background:#101010;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none}
.qb{flex:1}
.qb h4{font-size:13px;font-weight:500;margin:4px 0 12px;line-height:1.6}
.op{display:flex;align-items:center;gap:10px;width:100%;height:37px;border-radius:99px;border:1px solid #2c2c2c;background:#050505;padding:0 12px;margin-bottom:8px;font-size:11px;text-align:right}
.op i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;flex:none}
.op.ok{border-color:#2ecc71}.op.ok i{background:#2ecc71;border-color:#2ecc71}
.op.no{border-color:#e74c3c}.op.no i{border-color:#e74c3c}
.btn{display:block;margin:14px auto 0;background:#101010;border:1px solid var(--blue);color:#4fb3ec;border-radius:99px;padding:10px 34px;font-size:12px}
#scr.in{animation:none}
#scr.in>*,#scr.in .grid>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@media(min-width:500px){#app{border-radius:30px;box-shadow:0 0 0 1px #333,0 30px 80px rgba(0,0,0,.6);height:96%;max-height:820px;min-height:0;margin-top:2vh}}
#nav{box-shadow:0 -6px 24px rgba(0,0,0,.5)}
#nav .t.on{color:#4fb3ec}
#dot{box-shadow:0 0 0 5px var(--bg),0 6px 18px rgba(11,134,201,.5)}
.pt{display:flex;gap:6px;margin-top:14px}
.pt div{flex:1;background:transparent;border-radius:14px;padding:8px 0;text-align:center;transition:.3s}
.pt div.on{background:transparent}
.pt small{display:block;font-size:9px;color:var(--mut)}
.pt .on small{color:#4fb3ec}
.pt b{font-size:10.5px;font-weight:500}.pt .on b{color:#4fb3ec}
.sm .tile{height:92px;gap:8px;font-size:12px}
.sm .tile svg{width:30px;height:30px}.sm .tile .q{font-size:28px;line-height:30px}
.verse{font-family:Amiri,serif;font-size:var(--fs,17px);line-height:2;margin:8px 0}
.ref{font-size:9.5px;color:var(--mut)}
.pg{height:3px;background:#222;border-radius:3px;margin-top:10px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .5s}
.op.no{animation:sh .35s}.op.ok{animation:pu .4s}
@keyframes sh{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
@keyframes pu{50%{transform:scale(1.03)}}
.bar2{height:3px;background:#222;border-radius:3px;margin-top:10px;overflow:hidden;width:100%}
.bar2 i{display:block;height:100%;background:var(--blue);animation:pr 40s linear forwards}
@keyframes pr{from{width:0}to{width:100%}}
.rc{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:12px}
.quran-index{margin-bottom:8px}.surah-list{display:flex;flex-direction:column;gap:4px}.surah-choice{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;background:#000;border-radius:16px;text-align:right;direction:rtl}.surah-choice:active{transform:scale(.98)}.surah-num{width:35px;height:35px;border-radius:11px;background:var(--dk);display:flex;align-items:center;justify-content:center;color:#4fb3ec;font-size:13px;font-weight:700;flex:none}.surah-name{flex:1;min-width:0}.surah-name b{display:block;font-size:12px}.surah-name small{display:block;color:var(--mut);font-size:9px;margin-top:2px}.surah-open{opacity:.6}.surah-open svg{width:17px;height:17px}.audio-head{padding:16px 14px}.audio-kicker{text-align:center;color:var(--mut);font-size:10px;margin-bottom:8px}.audio-now{text-align:center;font-size:18px;margin-top:15px}.audio-hint{text-align:center;color:var(--mut);font-size:9px;margin-top:3px}.audio-list{background:#000;border-radius:22px;padding:5px 12px}.audio-row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #1b1b1b}.audio-row:last-child{border-bottom:0}.audio-meta{direction:rtl}.audio-meta b{display:block;font-size:12px}.audio-meta small{display:block;color:var(--mut);font-size:9px;margin-top:2px}.audio-action{display:flex;align-items:center;gap:9px}
.audio-page{padding:0 4px 14px}.audio-selectors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.audio-select{height:48px;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:space-around;gap:4px;font-size:10px;padding:0 8px}.audio-select svg{width:20px;height:20px;background:#fff;fill:#000;border-radius:50%;padding:3px}.audio-select b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reciter-portrait{width:190px;height:190px;margin:0 auto 20px;border-radius:50%;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;border:1px solid #3a3a3a}.reciter-portrait img{width:100%;height:100%;object-fit:cover}.reciter-portrait svg{width:70px;height:70px;opacity:.7}.audio-details{background:#000;border-radius:10px;padding:12px 10px;text-align:center;font-size:10px;line-height:2;margin:0 15px 22px}.audio-details>b{font-size:11px}.audio-details hr{border:0;border-top:1px solid #aaa;margin:5px -10px}.audio-timeline{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;direction:ltr;font:10px system-ui;color:#eee;margin:0 9px}.audio-timeline input{accent-color:#0b86c9}.transport{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:15px;direction:ltr}.transport button{width:29px;height:34px;display:flex;align-items:center;justify-content:center}.transport button svg{width:25px;height:25px}.transport .transport-main{width:45px;height:45px;background:#000;border-radius:14px}.transport .transport-main svg{width:30px;height:30px}.audio-caption{text-align:center;color:var(--mut);font-size:9px;margin-top:7px}
.fs{display:flex;gap:12px;align-items:center}.fs button{background:#1a1a1a;border-radius:10px;width:36px;height:32px;font-size:14px}

/* time-of-day atmosphere: the original phone canvas remains unchanged */
body{transition:background 2.5s ease;color:#fff}
body.sunset{background:linear-gradient(180deg,#643527,#232323)}
body.dawn{background:linear-gradient(180deg,#31465b,#232323)}
body.night{background:linear-gradient(180deg,#101823,#232323)}
body.sunset #app:before,body.dawn #app:before{content:none}
body.night #app:before{content:"";position:absolute;inset:72px 0 66px;pointer-events:none;opacity:.16;background:radial-gradient(circle at 72% 12%,#4fb3ec 0,transparent 28%)}
#app>*{position:relative;z-index:1}
#loc{display:block;margin:6px auto 0;color:#4fb3ec;font-size:9px}
#detSearch{margin-top:8px}
.ytimg{width:100%;height:100%;object-fit:cover;border-radius:10px}
.audio-error{color:#e74c3c;font-size:9px;text-align:center;margin-top:7px}

const DAILY_AYAH_POOL=[["يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ ۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ","البَقَرَةِ: 153 · العبرة: الصبر مع الصلاة يعين القلب على الثبات."],["لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","البَقَرَةِ: 286 · العبرة: رحمة الله أوسع من تقصيرنا، فاسأله العفو دائمًا."],["رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ ٱلْوَهَّابُ","آلِ عِمۡرَانَ: 8 · العبرة: ثبّت قلبك على الإيمان ولا تجعل الدعاء آخر خيار."],["وَلَا تَهِنُوا۟ وَلَا تَحْزَنُوا۟ وَأَنتُمُ ٱلْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ","آلِ عِمۡرَانَ: 139 · العبرة: بعد التعب تأتي قوة جديدة لمن أحسن التوكل."],["فَبِمَا رَحْمَةٍۢ مِّنَ ٱللَّهِ لِنتَ لَهُمْ ۖ وَلَوْ كُنتَ فَظًّا غَلِيظَ ٱلْقَلْبِ لَٱنفَضُّوا۟ مِنْ حَوْلِكَ ۖ فَٱعْفُ عَنْهُمْ وَٱسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِى ٱلْأَمْرِ ۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى ٱللَّهِ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَوَكِّلِينَ","آلِ عِمۡرَانَ: 159 · العبرة: الرفق والحكمة يفتحان القلوب قبل الكلمات."],["يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُونُوا۟ قَوَّٰمِينَ لِلَّهِ شُهَدَآءَ بِٱلْقِسْطِ ۖ وَلَا يَجْرِمَنَّكُمْ شَنَـَٔانُ قَوْمٍ عَلَىٰٓ أَلَّا تَعْدِلُوا۟ ۚ ٱعْدِلُوا۟ هُوَ أَقْرَبُ لِلتَّقْوَىٰ ۖ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ خَبِيرٌۢ بِمَا تَعْمَلُونَ","المَائـِدَةِ: 8 · العبرة: العدل مطلوب مع القريب والبعيد وفي كل حال."],["وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ وَلَا تَنَٰزَعُوا۟ فَتَفْشَلُوا۟ وَتَذْهَبَ رِيحُكُمْ ۖ وَٱصْبِرُوٓا۟ ۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ","الأَنفَالِ: 46 · العبرة: اجعل ذكرك لله سببًا لاجتماع قلبك وقوتك."],["قُل لَّن يُصِيبَنَآ إِلَّا مَا كَتَبَ ٱللَّهُ لَنَا هُوَ مَوْلَىٰنَا ۚ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ","التَّوۡبَةِ: 51 · العبرة: اطمئن إلى تقدير الله وخذ بالأسباب."],["يَٰٓأَيُّهَا ٱلنَّاسُ قَدْ جَآءَتْكُم مَّوْعِظَةٌۭ مِّن رَّبِّكُمْ وَشِفَآءٌۭ لِّمَا فِى ٱلصُّدُورِ وَهُدًۭى وَرَحْمَةٌۭ لِّلْمُؤْمِنِينَ","يُونُسَ: 57 · العبرة: القرآن شفاء للقلوب وتذكير بنعمة الله."],["۞ وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ إِلَّا عَلَى ٱللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا ۚ كُلٌّۭ فِى كِتَٰبٍۢ مُّبِينٍۢ","هُودٍ: 6 · العبرة: رزق الله محفوظ، فاطلبه بالحلال واطمئن."],["يَٰبَنِىَّ ٱذْهَبُوا۟ فَتَحَسَّسُوا۟ مِن يُوسُفَ وَأَخِيهِ وَلَا تَا۟يْـَٔسُوا۟ مِن رَّوْحِ ٱللَّهِ ۖ إِنَّهُۥ لَا يَا۟يْـَٔسُ مِن رَّوْحِ ٱللَّهِ إِلَّا ٱلْقَوْمُ ٱلْكَٰفِرُونَ","يُوسُفَ: 87 · العبرة: لا تيأس من رحمة الله مهما طال البلاء."],["ٱلَّذِينَ ءَامَنُوا۟ وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ ٱللَّهِ ۗ أَلَا بِذِكْرِ ٱللَّهِ تَطْمَئِنُّ ٱلْقُلُوبُ","الرَّعۡدِ: 28 · العبرة: بذكر الله تهدأ النفس ويستقر القلب."],["وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ ۖ وَلَئِن كَفَرْتُمْ إِنَّ عَذَابِى لَشَدِيدٌۭ","إِبۡرَاهِيمَ: 7 · العبرة: شكر النعمة يحفظها ويزيدها."],["۞ إِنَّ ٱللَّهَ يَأْمُرُ بِٱلْعَدْلِ وَٱلْإِحْسَٰنِ وَإِيتَآئِ ذِى ٱلْقُرْبَىٰ وَيَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ وَٱلْبَغْىِ ۚ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ","النَّحۡلِ: 90 · العبرة: الإحسان والعدل أساس صلاح الحياة."],["۞ وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوٓا۟ إِلَّآ إِيَّاهُ وَبِٱلْوَٰلِدَيْنِ إِحْسَٰنًا ۚ إِمَّا يَبْلُغَنَّ عِندَكَ ٱلْكِبَرَ أَحَدُهُمَآ أَوْ كِلَاهُمَا فَلَا تَقُل لَّهُمَآ أُفٍّۢ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًۭا كَرِيمًۭا","الإِسۡرَاءِ: 23 · العبرة: بر الوالدين عبادة عظيمة تبدأ بالكلمة الطيبة."],["إِذْ أَوَى ٱلْفِتْيَةُ إِلَى ٱلْكَهْفِ فَقَالُوا۟ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةًۭ وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًۭا","الكَهۡفِ: 10 · العبرة: الدعاء في الشدة باب أمل لا يغلق."],["قَالَ رَبِّ ٱشْرَحْ لِى صَدْرِى","طه: 25 · العبرة: اطلب العلم والعون من الله بقلب صادق."],["قَالَ لَا تَخَافَآ ۖ إِنَّنِى مَعَكُمَآ أَسْمَعُ وَأَرَىٰ","طه: 46 · العبرة: معية الله تمنح المؤمن أمانًا في الطريق."],["وَذَا ٱلنُّونِ إِذ ذَّهَبَ مُغَٰضِبًۭا فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ فَنَادَىٰ فِى ٱلظُّلُمَٰتِ أَن لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّٰلِمِينَ","الأَنبِيَاءِ: 87 · العبرة: الفرج قريب لمن دعا ربه بصدق."],["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قَدْ أَفْلَحَ ٱلْمُؤْمِنُونَ","المُؤۡمِنُونَ: 1 · العبرة: الفلاح يبدأ بإصلاح الصلاة والقلب."],["۞ ٱللَّهُ نُورُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ مَثَلُ نُورِهِۦ كَمِشْكَوٰةٍۢ فِيهَا مِصْبَاحٌ ۖ ٱلْمِصْبَاحُ فِى زُجَاجَةٍ ۖ ٱلزُّجَاجَةُ كَأَنَّهَا كَوْكَبٌۭ دُرِّىٌّۭ يُوقَدُ مِن شَجَرَةٍۢ مُّبَٰرَكَةٍۢ زَيْتُونَةٍۢ لَّا شَرْقِيَّةٍۢ وَلَا غَرْبِيَّةٍۢ يَكَادُ زَيْتُهَا يُضِىٓءُ وَلَوْ لَمْ تَمْسَسْهُ نَارٌۭ ۚ نُّورٌ عَلَىٰ نُورٍۢ ۗ يَهْدِى ٱللَّهُ لِنُورِهِۦ مَن يَشَآءُ ۚ وَيَضْرِبُ ٱللَّهُ ٱلْأَمْثَٰلَ لِلنَّاسِ ۗ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌۭ","النُّورِ: 35 · العبرة: نور الله يهدي القلب إذا صدق في طلب الحق."],["وَعِبَادُ ٱلرَّحْمَٰنِ ٱلَّذِينَ يَمْشُونَ عَلَى ٱلْأَرْضِ هَوْنًۭا وَإِذَا خَاطَبَهُمُ ٱلْجَٰهِلُونَ قَالُوا۟ سَلَٰمًۭا","الفُرۡقَانِ: 63 · العبرة: التواضع يزيد الإنسان رفعة ومحبة."],["وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ","الشُّعَرَاءِ: 80 · العبرة: العمل الصالح هو الزاد الحقيقي في كل يوم."],["فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰٓ إِلَى ٱلظِّلِّ فَقَالَ رَبِّ إِنِّى لِمَآ أَنزَلْتَ إِلَىَّ مِنْ خَيْرٍۢ فَقِيرٌۭ","القَصَصِ: 24 · العبرة: فضل الله قريب ممن أحسن الظن وسعى."],["وَٱلَّذِينَ جَٰهَدُوا۟ فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ۚ وَإِنَّ ٱللَّهَ لَمَعَ ٱلْمُحْسِنِينَ","العَنكَبُوتِ: 69 · العبرة: المجاهدة تفتح أبواب الهداية."],["وَمِنْ ءَايَٰتِهِۦٓ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَٰجًۭا لِّتَسْكُنُوٓا۟ إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةًۭ وَرَحْمَةً ۚ إِنَّ فِى ذَٰلِكَ لَءَايَٰتٍۢ لِّقَوْمٍۢ يَتَفَكَّرُونَ","الرُّومِ: 21 · العبرة: المودة والرحمة أساس السكينة في البيت."],["يَٰبُنَىَّ أَقِمِ ٱلصَّلَوٰةَ وَأْمُرْ بِٱلْمَعْرُوفِ وَٱنْهَ عَنِ ٱلْمُنكَرِ وَٱصْبِرْ عَلَىٰ مَآ أَصَابَكَ ۖ إِنَّ ذَٰلِكَ مِنْ عَزْمِ ٱلْأُمُورِ","لُقۡمَانَ: 17 · العبرة: الصلاة والصبر يصنعان شخصية قوية."],["يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَقُولُوا۟ قَوْلًۭا سَدِيدًۭا","الأَحۡزَابِ: 70 · العبرة: ليكن كلامك واضحًا طيبًا يرضي الله."],["۞ قُلْ يَٰعِبَادِىَ ٱلَّذِينَ أَسْرَفُوا۟ عَلَىٰٓ أَنفُسِهِمْ لَا تَقْنَطُوا۟ مِن رَّحْمَةِ ٱللَّهِ ۚ إِنَّ ٱللَّهَ يَغْفِرُ ٱلذُّنُوبَ جَمِيعًا ۚ إِنَّهُۥ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ","الزُّمَرِ: 53 · العبرة: لا تقنط من رحمة الله، فباب التوبة مفتوح."],["وَقَالَ رَبُّكُمُ ٱدْعُونِىٓ أَسْتَجِبْ لَكُمْ ۚ إِنَّ ٱلَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِى سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ","غَافِرٍ: 60 · العبرة: الدعاء عبادة ووعد الله بالاستجابة حق."],["وَلَا تَسْتَوِى ٱلْحَسَنَةُ وَلَا ٱلسَّيِّئَةُ ۚ ٱدْفَعْ بِٱلَّتِى هِىَ أَحْسَنُ فَإِذَا ٱلَّذِى بَيْنَكَ وَبَيْنَهُۥ عَدَٰوَةٌۭ كَأَنَّهُۥ وَلِىٌّ حَمِيمٌۭ","فُصِّلَتۡ: 34 · العبرة: ادفع الإساءة بالإحسان يتبدل الخصام قربًا."],["وَلَمَن صَبَرَ وَغَفَرَ إِنَّ ذَٰلِكَ لَمِنْ عَزْمِ ٱلْأُمُورِ","الشُّورَىٰ: 43 · العبرة: العفو مع القدرة من مكارم الأخلاق."],["إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌۭ فَأَصْلِحُوا۟ بَيْنَ أَخَوَيْكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُرْحَمُونَ","الحُجُرَاتِ: 10 · العبرة: أصلح بين الناس تكن سببًا في الخير."],["وَلَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ وَنَعْلَمُ مَا تُوَسْوِسُ بِهِۦ نَفْسُهُۥ ۖ وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ ٱلْوَرِيدِ","قٓ: 16 · العبرة: الله أقرب إلى عبده ويعلم ما يخفيه صدره."],["وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ","الذَّارِيَاتِ: 56 · العبرة: الغاية من الحياة عبادة الله وإعمار الخير."],["وَأَن لَّيْسَ لِلْإِنسَٰنِ إِلَّا مَا سَعَىٰ","النَّجۡمِ: 39 · العبرة: الإنسان ينال ثمرة سعيه، فابدأ بخطوة صالحة."],["فَبِأَىِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ","الرَّحۡمَٰن: 13 · العبرة: نعم الله لا تُحصى، فاجعل لسانك رطبًا بالحمد."],["هُوَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ فِى سِتَّةِ أَيَّامٍۢ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۚ يَعْلَمُ مَا يَلِجُ فِى ٱلْأَرْضِ وَمَا يَخْرُجُ مِنْهَا وَمَا يَنزِلُ مِنَ ٱلسَّمَآءِ وَمَا يَع const EFFECT_POOL={};Object.keys(EFFECT_AUDIO).forEach(k=>{const a=new Audio(EFFECT_AUDIO[k]);a.preload='auto';a.load();EFFECT_POOL[k]=a});function playEffect(kind,after){try{const a=EFFECT_POOL[kind]||EFFECT_POOL.click;a.pause();a.currentTime=0;a.volume=.82;a.onended=()=>after&&after();const p=a.play();if(p&&p.catch)p.catch(()=>after&&after());return a}catch(e){after&&after()}}
function playNotificationSequence(after){return playEffect('notify',after)}
function speakReminder(){try{if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance('صَلِّ على النبي');u.lang='ar-SA';u.rate=.85;u.pitch=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch(e){}}
function saveNotifyPrefs(){try{localStorage.setItem('yawaqit-notify',JSON.stringify({enabled:S.notifyEnabled,voice:S.adhanVoice,fajrVoice:S.fajrAdhanVoice,last:S.lastPrayerNotification,daily:S.dailyNotifyEnabled,hour:S.dailyNotifyHour,dailyLast:S.dailyNotifyLast,monthlyLast:S.monthlyNotifyLast,contentLast:S.contentNotifyLast}))}catch(_){} }
function loadNotifyPrefs(){try{const x=JSON.parse(localStorage.getItem('yawaqit-notify')||'{}');S.notifyEnabled=typeof x.enabled==='boolean'?x.enabled:true;if(x.voice&&ADHAN_SOUNDS[x.voice])S.adhanVoice=x.voice;if(x.fajrVoice&&ADHAN_SOUNDS[x.fajrVoice])S.fajrAdhanVoice=x.fajrVoice;if(x.last)S.lastPrayerNotification=x.last;S.dailyNotifyEnabled=typeof x.daily==='boolean'?x.daily:true;if(Number.isFinite(+x.hour))S.dailyNotifyHour=+x.hour;if(x.dailyLast)S.dailyNotifyLast=x.dailyLast;if(x.monthlyLast)S.monthlyNotifyLast=x.monthlyLast;if(x.contentLast)S.contentNotifyLast=x.contentLast}catch(_){} }
function playAdhan(prayer){const isFajr=prayer&&prayer[0]==='الفجر';const sound=isFajr?(ADHAN_SOUNDS[S.fajrAdhanVoice]||ADHAN_SOUNDS.fajr):(ADHAN_SOUNDS[S.adhanVoice]||ADHAN_SOUNDS.makkah);try{if(adhanAudio){adhanAudio.pause();adhanAudio.currentTime=0}if(isFajr&&'speechSynthesis' in window){const u=new SpeechSynthesisUtterance('الصلاة خير من النوم');u.lang='ar-SA';u.rate=.78;window.speechSynthesis.speak(u)}adhanAudio=new Audio(sound.url);adhanAudio.preload='auto';adhanAudio.play().catch(()=>{S.audioMsg='اضغط تشغيل للسماح بصوت الأذان';render()})}catch(_){} }
function previewAdhan(kind='normal'){const voice=kind==='fajr'?S.fajrAdhanVoice:S.adhanVoice;const sound=ADHAN_SOUNDS[voice]||ADHAN_SOUNDS.makkah;try{if(adhanAudio){adhanAudio.pause();adhanAudio.currentTime=0}adhanAudio=new Audio(sound.url);adhanAudio.volume=1;adhanAudio.preload='auto';const p=adhanAudio.play();if(p&&p.catch)p.catch(()=>{S.audioMsg='اضغط مرة أخرى للسماح بتشغيل الأذان';render()})}catch(e){S.audioMsg='تعذر تشغيل صوت الأذان';render()}}
function notifyPrayer(prayer){const now=new Date(),key=`${now.toISOString().slice(0,10)}-${prayer[0]}`;if(S.lastPrayerNotification===key)return;S.lastPrayerNotification=key;saveNotifyPrefs();const title=`حان وقت صلاة ${prayer[0]}`,body='تقبل الله طاعتكم';try{if('serviceWorker' in navigator&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'/assets/logo.png',badge:'/assets/logo.png',tag:key,renotify:true,dir:'rtl',sound:'/assets/notification-sound.mp3'}));else if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body,icon:'/assets/logo.png',tag:key});}catch(_){}playNotificationSequence(()=>playAdhan(prayer));}
function checkPrayerNotifications(){if(!S.notifyEnabled)return;const d=new Date(),sec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();for(const p of PR){const target=p[1]*3600+p[2]*60;if(Math.abs(sec-target)<=35){notifyPrayer(p);break}}}
function dailyReminderText(){const d=new Date(),day=d.getDay();if(day===5)return 'اللهم صل وسلم على نبينا محمد — يوم الجمعة';return 'سبحان الله وبحمده، سبحان الله العظيم'}
function islamicDateParts(){try{const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(new Date());return{day:+p.find(x=>x.type==='day').value,month:+p.find(x=>x.type==='month').value,year:+p.find(x=>x.type==='year').value}}catch(e){return null}}
function monthlyReminder(){const h=islamicDateParts();if(!h)return null;const m=h.month,d=h.day;if(m===9&&d===1)return['رمضان','رمضان شهر القرآن — أكثر من تلاوة القرآن والذكر.','quran'];if(m===9&&d===27)return['ليلة مباركة','اجتهد في الدعاء والقرآن والذكر في الليالي الوترية.','salawat'];if(m===10&&d===1)return['عيد الفطر','تقبل الله منا ومنكم، وأكثروا من التكبير والذكر.','salawat'];if(m===12&&d===1)return['عشر ذي الحجة','بدأت عشر ذي الحجة، فأكثر من التكبير والذكر والعمل الصالح.','salawat'];if(m===12&&d===9)return['يوم عرفة','يوم عرفة، أكثر من الدعاء والذكر والصيام لمن استطاع.','salawat'];if(m===12&&d===10)return['عيد الأضحى','تقبل الله طاعتكم، وأكثروا من التكبير والذكر.','salawat'];if(m===1&&d===10)return['يوم عاشوراء','يوم عاشوراء، تذكير بالصيام والذكر وشكر نعم الله.','salawat'];if(m===8&&d===15)return['ليلة النصف من شعبان','أكثر من الدعاء والذكر وسائر الطاعات.','salawat'];return null}
function showAppNotification(title,body,tag){try{if('serviceWorker' in navigator&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'/assets/logo.png',badge:'/assets/logo.png',tag,renotify:true,dir:'rtl',silent:false,sound:'/assets/notification-sound.mp3'}));else if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body,icon:'/assets/logo.png',tag});}catch(_){} }
function checkDailyReminders(){if(!S.dailyNotifyEnabled)return;const d=new Date(),key=d.toISOString().slice(0,10);if(d.getHours()!==Number(S.dailyNotifyHour)||d.getMinutes()>1||S.dailyNotifyLast===key)return;S.dailyNotifyLast=key;saveNotifyPrefs();const body=dailyReminderText();showAppNotification('تذكير من يواقيت',body,'daily-'+key);playNotificationSequence(speakReminder)}
function checkMonthlyReminders(){if(!S.dailyNotifyEnabled)return;const d=new Date(),h=islamicDateParts(),event=monthlyReminder();if(!h||!event||d.getHours()!==Number(S.dailyNotifyHour)||d.getMinutes()>1)return;const key=`${h.year}-${h.month}-${h.day}-${event[0]}`;if(S.monthlyNotifyLast===key)return;S.monthlyNotifyLast=key;saveNotifyPrefs();showAppNotification(event[0],event[1],'islamic-'+key);playNotificationSequence(()=>event[2]==='quran'?playRecitation(S.ap==null?0:S.ap):speakReminder())}
function speakArabicText(text){try{if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(String(text||''));u.lang='ar-SA';u.rate=.82;u.pitch=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch(e){}}
function checkContentReminders(){if(!S.dailyNotifyEnabled)return;const d=new Date(),hour=d.getHours(),minute=d.getMinutes(),date=d.toISOString().slice(0,10);if(minute>1)return;const plans={8:['ذكر الصباح','ابدأ يومك بذكر الله والصلاة على النبي ﷺ','salawat'],14:['ورد القرآن','حان وقت وردك من القرآن الكريم','quran'],20:['حديث اليوم','تذكير بحديث نبوي صحيح','hadith']};const plan=plans[hour];if(!plan)return;const key=`${date}-${hour}`;if(S.contentNotifyLast===key)return;S.contentNotifyLast=key;saveNotifyPrefs();let body=plan[1],text='صَلِّ على النبي';if(plan[2]==='hadith'){const h=(DET[0]||[])[dayIndex()%(DET[0]||[]).length];if(h){body=h[0];text='قال رسول الله صلى الله عليه وسلم: '+h[0]}}showAppNotification(plan[0],body,'content-'+key);playNotificationSequence(()=>plan[2]==='quran'?playRecitation(S.ap==null?0:S.ap):speakArabicText(text))}
function startDailyReminderLoop(){if(dailyNotifyTimer)clearInterval(dailyNotifyTimer);dailyNotifyTimer=null;if(S.dailyNotifyEnabled)dailyNotifyTimer=setInterval(()=>{checkDailyReminders();checkMonthlyReminders();checkContentReminders()},30000);if(S.dailyNotifyEnabled){checkDailyReminders();checkMonthlyReminders();checkContentReminders()}}

  if(S.tab==='home'&&!S.qz&&S.sub==null){const pr=prayers(),c=$('#cd');if(c)c.textContent=pr.cd;if(pr.n!==S.np)render()}
  if(S.tab==='vid'&&S.playing&&!S.qz&&S.sub==null){S.t=Math.min(VID[S.vid][2],S.t+SPD[S.spd]);
    const sk=$('#sk');if(sk){sk.value=S.t;const sp=sk.parentNode.querySelectorAll('span');sp[0].textContent=fmt(S.t);sp[1].textContent='- '+fmt(VID[S.vid][2]-S.t)}}
},1000);
window.addEventListener('resize',()=>moveDot());
document.fonts&&document.fonts.ready.then(()=>moveDot());
render(true);
swipeTabs();document.addEventListener('pointerdown',e=>{if(e.target.closest('.reels-feed video'))return;if(e.target.closest('button'))soundTap(classifyTap(e.target))},{passive:true});updateTimeTheme();startDailyReminderLoop();requestStartupPermissions();loadCollectedData();
</script>
